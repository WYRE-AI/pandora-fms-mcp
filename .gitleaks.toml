# Extend the default gitleaks rules. Test fixtures and the smoke script use
# obviously fake keys (tok-SECRET-0123456789, env-token, hdr-token).
[extend]
useDefault = true

[allowlist]
description = "Fake tokens used only in mocked tests and the offline smoke script"
paths = ['''(src|dist)/__tests__/.*\.test\.(ts|js)''', '''scripts/smoke\.mjs''']
